[workspace]
members = [
    "apps/meow-browser",
    "apps/meow-headless",
    "crates/css",
    "crates/display-list",
    "crates/embedder-api",
    "crates/engine",
    "crates/html",
    "crates/ipc",
    "crates/net",
    "crates/process-model",
    "crates/renderer",
    "crates/sandbox",
    "crates/url-policy",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
boa_engine = "0.21.1"
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio-tungstenite = "0.28.0"
bytes = "1.10.1"
cssparser = "0.37.0"
encoding_rs = "0.8.35"
html5ever = "0.39.0"
http = "1.3.1"
http-body-util = "0.1.4"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "gif"] }
base64 = "0.22.1"
resvg = { version = "0.45.1", default-features = false, features = ["text"] }
hyper = { version = "1.10.1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
pollster = "1.0.1"
seccompiler = "0.5.0"
nix = { version = "0.31.3", features = ["fs", "process", "resource", "sched"] }
skrifa = "0.42.1"
softbuffer = { version = "0.4.8", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "x11-dlopen"] }
tiny-skia = { version = "0.11.4", default-features = false, features = ["png-format", "simd"] }
tokio = { version = "1.53.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
vello = "0.9.0"
winit = "0.30.13"

[workspace.lints.rust]
unsafe_code = "deny"
