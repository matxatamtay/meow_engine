name: JavaScript backends

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Compile both backend configurations and run shared conformance
        run: python3 scripts/verify_js_backends.py
